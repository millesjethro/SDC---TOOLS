<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SDC - SCRAPER</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="title-bar">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.6"/>
        <line x1="3" y1="9" x2="21" y2="9" stroke="currentColor" stroke-width="1.6"/>
        <line x1="3" y1="15" x2="21" y2="15" stroke="currentColor" stroke-width="1.6"/>
        <line x1="12" y1="3" x2="12" y2="21" stroke="currentColor" stroke-width="1.6"/>
      </svg>
      <h1>SDC - SCRAPER</h1>
    </header>

    <div class="scan-row">
      <div class="selector-field">
        <input id="selectorInput" aria-label="Selected element" type="text" placeholder="Click the target, then click an item on the page" readonly>
        <button id="pickBtn" class="icon-btn" type="button" title="Select an item on the page" aria-label="Select an item on the page" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="12" cy="12" r="1.6" fill="currentColor"/>
            <line x1="12" y1="1.5" x2="12" y2="5" stroke="currentColor" stroke-width="1.6"/>
            <line x1="12" y1="19" x2="12" y2="22.5" stroke="currentColor" stroke-width="1.6"/>
            <line x1="1.5" y1="12" x2="5" y2="12" stroke="currentColor" stroke-width="1.6"/>
            <line x1="19" y1="12" x2="22.5" y2="12" stroke="currentColor" stroke-width="1.6"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="nav-row">
      <div class="nav-buttons">
        <button id="backBtn" class="nav-btn" type="button" disabled>BACK</button>
        <button id="nextBtn" class="nav-btn" type="button" disabled>NEXT</button>
        <span id="navLabel" class="nav-label"></span>
      </div>
      <button id="autoScrollToggle" class="autoscroll-toggle" type="button" aria-pressed="false">
        Auto-Scroll
      </button>
    </div>

    <div id="controlsRow" class="controls-row">
      <select id="platformSelect" class="select-field" aria-label="Filter to Name and Username">
        <option value="all" selected>All columns</option>
        <option value="facebook">Facebook</option>
        <option value="instagram">Instagram</option>
        <option value="threads">Threads</option>
        <option value="twitter">Twitter</option>
        <option value="tiktok">TikTok</option>
      </select>
      <button id="sortNameBtn" class="sort-btn" type="button" title="Sort by Name">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 4v16M7 4l-3.5 3.5M7 4l3.5 3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M17 20V4M17 20l3.5-3.5M17 20l-3.5-3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="sortLabel">Sort Name A–Z</span>
      </button>
    </div>

    <div class="search-row">
      <input id="searchInput" aria-label="Search results" type="text" class="search-field" placeholder="Search results…">
    </div>

    <div id="workbookRow" class="workbook-row">
      <button id="addSheetBtn" class="add-sheet-btn" type="button" title="Save the current results as a sheet, so you can scrape another list (e.g. Following) and export both together">
        + Add to Workbook
      </button>
      <div id="sheetChips" class="sheet-chips"></div>
    </div>

    <div id="resultsArea" class="results-area">
      <div id="emptyState" class="empty-state">
        Click the target icon, then select a row or list item on the page.
      </div>
      <div id="tableWrap" class="table-wrap hidden">
        <table id="dataTable"></table>
      </div>
    </div>

    <div id="statusBar" class="status-bar" role="status"></div>

    <footer class="button-row">
      <button id="clearBtn" class="pill-btn red">CLEAR</button>
      <button id="copyBtn" class="pill-btn blue">COPY</button>
      <button id="excelBtn" class="pill-btn green">EXCEL</button>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
